<!doctype html><html lang=ko><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>제로데일리 관제탑</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--tx:#e6e9ef;--dim:#8b93a3;
 --blue:#4c8dff;--green:#3ecf8e;--red:#ff6b6b;--amber:#ffb020;--purple:#b78cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Apple SD Gothic Neo','Pretendard',sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1780px;margin:0 auto;padding:18px 22px 60px}
.cols{display:block}
@media(min-width:1280px){
 .cols{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:0 30px;align-items:start}
 .cols>div{min-width:0}
 .cols h2:first-child{margin-top:26px}
}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
h1{font-size:19px;margin:0} h2{font-size:14px;color:var(--dim);margin:26px 0 10px;font-weight:600;letter-spacing:.3px}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge.on{background:#12331f;color:var(--green)} .badge.off{background:#3a1519;color:var(--red)}
.btns button{background:#1e2430;color:var(--tx);border:1px solid var(--line);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;margin-left:6px}
.btns button:hover{border-color:var(--blue);color:var(--blue)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .lb{font-size:12px;color:var(--dim)} .card .v{font-size:21px;font-weight:800;margin-top:3px}
.card .sub{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.45}
.v.green{color:var(--green)}.v.blue{color:var(--blue)}.v.amber{color:var(--amber)}.v.purple{color:var(--purple)}
.order{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:14px 16px;margin:10px 0}
.order.done{border-left-color:var(--line);opacity:.65}
.order .top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.order .name{font-weight:700;font-size:15px}
.order .price{font-weight:800;color:var(--green);font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin:10px 0;font-size:13px}
.grid2 .k{color:var(--dim)}
.profit{background:#10161f;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12.5px;color:var(--dim)}
.profit b{color:var(--green);font-size:14px}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.act a,.act button{text-decoration:none;background:#1e2430;border:1px solid var(--line);color:var(--tx);padding:8px 13px;border-radius:8px;font-size:12.5px;cursor:pointer}
.act a.go{background:#0d2b4d;border-color:#1f4c86;color:#9ec8ff;font-weight:700}
.act select,.act input{background:#0f141c;border:1px solid var(--line);color:var(--tx);padding:8px 10px;border-radius:8px;font-size:12.5px}
.act input{width:170px}
.act button.ship{background:#12331f;border-color:#1d5c38;color:var(--green);font-weight:700}
.stamp{font-size:11px;color:var(--dim)}
.alert{background:#241a10;border-left:3px solid var(--amber);padding:9px 13px;margin:7px 0;border-radius:8px;font-size:13px}
.okbox{background:#12331f;border-left:3px solid var(--green);padding:9px 13px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border-radius:12px;overflow:hidden}
td,th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.cp{background:rgba(76,141,255,.10)} th.cp{color:#9ec8ff}
.ss{background:rgba(62,207,142,.08)} th.ss{color:#7fdcae}
th{color:var(--dim);font-weight:600;font-size:11.5px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:2px 7px;border-radius:10px} .tag.bad{background:#3a1519;color:var(--red)} .tag.ok{background:#12331f;color:var(--green)}
pre{background:#0a0c10;padding:12px;border-radius:10px;font-size:11px;overflow:auto;max-height:240px;color:#9aa3b5}
details summary{cursor:pointer;color:var(--dim);font-size:13px;margin:20px 0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#0f141c;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;margin:3px 5px 3px 0}
.chip:hover{border-color:var(--blue)} .chip .k{color:var(--dim);font-size:11px}
.chip::after{content:'⧉';color:var(--dim);font-size:11px}
.steps{display:flex;gap:6px;align-items:center;font-size:11.5px;margin:8px 0}
.step{padding:3px 10px;border-radius:12px;background:#0f141c;border:1px solid var(--line);color:var(--dim)}
.step.cur{background:#0d2b4d;border-color:#1f4c86;color:#9ec8ff;font-weight:700}
.step.done{background:#12331f;border-color:#1d5c38;color:var(--green)}
.arrow{color:var(--dim)}
.act button.mark{background:#241a10;border-color:#5c451d;color:var(--amber)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e2430;border:1px solid var(--blue);padding:10px 18px;border-radius:10px;display:none;font-size:13px;z-index:9}
.dim{color:var(--dim)}
</style></head><body><div class=wrap>
<header>
 <div style="display:flex;align-items:center;gap:12px"><h1>제로데일리 관제탑</h1><span id=loop class=badge></span></div>
 <div class=btns>
  <button onclick="run('orders')">주문 수집</button>
  <button onclick="run('watch')">재고·가격 감시</button>
  <button onclick="run('scan')">브랜드 스캔</button>
  <button onclick="run('loop')">감시루프 시작</button>
 </div>
</header>

<h2>이번 달 정산 <span id=month class=dim></span> — 구글시트 판매기록 기준</h2>
<div class=cards id=money></div>


<h2>비용 이벤트 원장 <span class=dim>— 돈에 영향 주는 모든 설정 (마진가드가 2시간마다 마이너스 검사)</span></h2>
<div id=ledger></div>

<div class=cols>
<div>
<h2 id=orders_h>처리할 주문</h2>
<div id=orders></div>
</div>
<div>
<h2>내가 판단할 일 <span id=watch_ts class=dim></span></h2>
<div id=alerts></div>

<h2>상품 라이프사이클 <span id=lc_sum class=dim></span></h2>
<div id=lifecycle></div>
</div>
</div>

<h2>판매 상품 <span id=mstate class=dim></span></h2>
<div style="overflow-x:auto"><table id=prods></table></div>

<details><summary>감시루프 로그 보기</summary><pre id=log></pre></details>
<div class=dim style="margin-top:14px;font-size:11.5px">60초마다 자동 갱신 (입력 중에는 멈춤) · 원격판 — 버튼 동작은 맥이 5분 내 실행 · 데이터는 5분마다 동기화</div>
<div id=toast></div>

<script>
const 원=n=>n==null||n===''?'-':Number(n).toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let paused=false;
document.addEventListener('focusin',e=>{if(e.target.tagName==='INPUT')paused=true});
document.addEventListener('focusout',()=>setTimeout(()=>paused=false,300));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function copy(t,m){navigator.clipboard.writeText(t).then(()=>toast(m||'복사됨'))}

function render(d){
 // 루프 배지
 const hb=d.heartbeat_age, el=document.getElementById('loop');
 if(hb==null){el.className='badge off';el.textContent='● 감시루프 꺼짐 — [감시루프 시작] 누르세요'}
 else if(hb<2100){el.className='badge on';el.textContent=`● 감시 중 (${Math.floor(hb/60)}분 전 확인)`}
 else{el.className='badge off';el.textContent=`● 감시 멈춤 (${Math.floor(hb/60)}분 무응답)`}

 // 돈 요약
 const m=d.money;document.getElementById('month').textContent=m.month+' · 판매 '+m.count+'건';
 const cp=m.coupang||{count:0,sales:0,profit:0}, ss=m.ss||{count:0,sales:0,profit:0};
 document.getElementById('money').innerHTML=`
  <div class=card style="border-color:#1f4c86"><div class=lb>🏆 쿠팡 (주력) — 이번달</div>
   <div class="v blue">${원(cp.sales)}</div>
   <div class=sub>주문 ${cp.count}건 · 순이익 <b style="color:var(--green)">${원(cp.profit)}</b><br>수수료 11.55%</div></div>
  <div class=card><div class=lb>스마트스토어 (보조) — 이번달</div>
   <div class="v blue">${원(ss.sales)}</div>
   <div class=sub>주문 ${ss.count}건 · 순이익 <b style="color:var(--green)">${원(ss.profit)}</b><br>수수료 6.7% 실측</div></div>
  <div class=card><div class=lb>합계 순이익</div><div class="v green">${원(m.profit)}</div>
   <div class=sub>매출 ${원(m.sales)} · 마진율 ${m.sales?Math.round(m.profit/m.sales*100):0}%</div></div>
  <div class=card><div class=lb>떼어둘 세금 (부가세 예수)</div><div class="v amber">${원(m.vat)}</div>
   <div class=sub>순이익÷11 — 신고 때 낼 돈<br>👉 세금통장 이체 권장(매출 10%): <b>${원(m.tax_transfer)}</b></div></div>
  <div class=card><div class=lb>내 월급 가능액 (세후 70%)</div><div class="v purple">${원(m.salary)}</div>
   <div class=sub>사업 유보 30%: ${원(m.reserve)}</div></div>
  <div class=card><div class=lb>새싹 등급 진행률 (최근 3개월)</div>
   <div class="v purple">${(d.growth&&d.growth.새싹_건수||0)}/100건</div>
   <div class=sub>매출 ${원(d.growth&&d.growth.새싹_매출||0)} / 200만원 목표<br>${d.growth&&d.growth.주간최다SKU?`주간 최다판매: ${esc(d.growth.주간최다SKU.name)} ${d.growth.주간최다SKU.n}건`:'주간 판매 데이터 대기'}</div></div>
  <div class=card><div class=lb>다음 세금 일정</div><div class=v style="font-size:15px">${esc(m.next_tax)}</div>
   <div class=sub>부가세 1/25·7/25 · 종합소득세 5/31</div></div>`;

 // 주문
 const news=d.orders.filter(o=>!String(o.상태||'').startsWith('발송완료')),
       dones=d.orders.filter(o=>String(o.상태||'').startsWith('발송완료'));
 const cpN=news.filter(o=>o.마켓==='쿠팡'), ssN=news.filter(o=>o.마켓!=='쿠팡');
 document.getElementById('orders_h').textContent=`처리할 주문 ${news.length}건 (쿠팡 ${cpN.length} · 스스 ${ssN.length})`+(dones.length?` · 발송완료 ${dones.length}건`:'');
 const card=o=>{
  const st=o.상태||'신규';
  const isNew=st==='신규', isOrdered=st==='발주완료', isDone=st.startsWith('발송완료');
  const musinsa=o.무신사번호?`https://www.musinsa.com/products/${o.무신사번호}`:null;
  const p=o.손익||{};
  const full=`${o.수령인} ${o.연락처}\n${o.주소}\n${o.배송메모||''}`.trim();
  const chip=(k,v)=>v?`<span class=chip onclick='copy(${JSON.stringify(String(v))},"${k} 복사됨")'><span class=k>${k}</span>${esc(v)}</span>`:'';
  const steps=`<div class=steps>
    <span class="step ${isNew?'cur':'done'}">① 신규</span><span class=arrow>→</span>
    <span class="step ${isOrdered?'cur':(isDone?'done':'')}">② 발주완료 (무신사 주문됨)</span><span class=arrow>→</span>
    <span class="step ${isDone?'done':''}">③ 발송완료 (송장 등록)</span></div>`;
  let actions='';
  if(isNew){actions=`<div class=act>
    ${musinsa?`<a class=go href="${musinsa}" target=_blank>무신사에서 발주하기 ↗</a>`:''}
    <button class=mark onclick="mark('${o.productOrderId}','발주완료')">✔ 발주 완료로 표시</button>
   </div>`}
  else if(isOrdered && o.마켓==='쿠팡'){actions=`<div class=act>
    <a class=go href="https://wing.coupang.com" target=_blank>WING에서 송장 등록 ↗</a>
    <button class=mark onclick="mark('${o.productOrderId}','발송완료(수기)')">✔ 발송 완료로 표시</button>
   </div>`}
  else if(isOrdered){actions=`<div class=act>
    ${musinsa?`<a href="${musinsa}" target=_blank>무신사 주문내역 확인 ↗</a>`:''}
    <select id="dc_${o.productOrderId}">
     <option value=CJGLS>CJ대한통운</option><option value=HANJIN>한진택배</option>
     <option value=LOTTE>롯데택배</option><option value=LOGEN>로젠택배</option>
     <option value=EPOST>우체국</option><option value=KDEXP>경동택배</option>
    </select>
    <input id="tn_${o.productOrderId}" placeholder="송장번호" inputmode=numeric>
    <button class=ship onclick="ship('${o.productOrderId}','${o.마켓==='쿠팡'?'쿠팡':'스스'}')">발송처리 (${o.마켓==='쿠팡'?'쿠팡':'스스'}에 송장 등록)</button>
    <button class=mark onclick="mark('${o.productOrderId}','발송완료(수기)')">✔ 이미 발송함 — 표시만</button>
   </div>`}
  return `<div class="order ${isDone?'done':''}">
   <div class=top><span class=name><span class=tag style="background:${o.마켓==='쿠팡'?'#0d2b4d':'#12331f'};color:${o.마켓==='쿠팡'?'#9ec8ff':'#3ecf8e'};margin-right:8px">${esc(o.마켓||'스스')}</span>${esc(o.상품명)}</span><span class=price>${원(o.판매가)}</span></div>
   <div class=stamp>${esc(o.날짜)} · 옵션 <b>${esc(o.옵션)||'-'}</b>${isDone&&o.송장?` · ${esc(o.택배사||'')} ${esc(o.송장)}`:''}${o.발주확인&&!isDone?` · 무신사 재고 ${esc(o.발주확인)}`:''}</div>
   ${steps}
   <div>${chip('받는분',o.수령인)}${chip('연락처',o.연락처)}${chip('주소',o.주소)}${chip('배송메모',o.배송메모)}
    <span class=chip onclick='copy(${JSON.stringify(full)},"전체 복사됨")'><span class=k>전체</span>한번에</span></div>
   <div class=profit>남는 돈: 결제 ${원(o.판매가)} − 매입 ${원(o.원가)} − 수수료 ${원(p.수수료)} − 부가세 ${원(p.부가세)} = <b>${원(p.내손에)}</b></div>
   ${actions}
  </div>`};
 const grp=(t,arr)=>arr.length?`<div class=dim style="margin:12px 0 4px;font-weight:700">${t} ${arr.length}건</div>`+arr.map(card).join(''):'';
 document.getElementById('orders').innerHTML=
  (news.length?grp('🏆 쿠팡',cpN)+grp('스마트스토어',ssN):'<div class=okbox>✓ 처리할 신규 주문 없음 — 주문이 오면 여기에 카드가 뜹니다</div>')
  +(dones.length?`<details><summary>발송완료 ${dones.length}건 보기</summary>${dones.map(card).join('')}</details>`:'');

 // 경보 — 판단 필요한 것만 크게, 자동 처리는 한 줄 요약
 const w=d.watch;document.getElementById('watch_ts').textContent=w.ts?`(${w.ts} · ${w.checked}개 점검)`:'(아직 감시 기록 없음)';
 const all=w.alerts||[];
 const act=all.filter(a=>a.처리==='판단필요'||a.처리==='실패');
 const auto=all.filter(a=>a.처리==='자동');
 const info=all.filter(a=>a.처리==='정보');
 let html='';
 if(act.length){
  html+=act.map(a=>`<div class=alert><b>[${esc(a.kind)}${a.처리==='실패'?' · 자동처리 실패':''}]</b> ${esc(a.name)} <span class=dim>(${esc(a.no)})</span><br>${esc(a.msg)}</div>`).join('');
 }else{
  html+='<div class=okbox>✓ 내가 판단할 일 없음'+(auto.length?` — 품절 ${auto.length}건은 자동으로 스스 재고 0 처리됨`:'')+'</div>';
 }
 if(auto.length||info.length){
  html+=`<details><summary>자동 처리 ${auto.length}건 · 참고 ${info.length}건 펼치기</summary>`
   +[...auto,...info].map(a=>`<div class=alert style="opacity:.55;border-left-color:#3ecf8e"><b>[${esc(a.kind)} · ${esc(a.처리)}]</b> ${esc(a.name)}<br>${esc(a.msg)}</div>`).join('')+'</details>';
 }
 document.getElementById('alerts').innerHTML=html||'<div class=okbox>✓ 경보 없음</div>';

 // 비용 이벤트 원장
 const lg=(d.ledger||{}).events||[];
 document.getElementById('ledger').innerHTML = lg.length
  ? lg.map(e=>{
     let dd='';
     if(e.end){const days=Math.ceil((new Date(e.end)-new Date())/864e5);dd=` <span class="tag ${days<=3?'bad':'ok'}">D-${days}</span>`;}
     return `<span class=chip style="cursor:default"><span class=k>${esc(e.kind)}·${esc(e.channel)}</span> ${esc(e.name)} ${e.amount?e.amount.toLocaleString()+'원':''}${dd}</span>`;
    }).join('')
  : '<div class=okbox>등록된 이벤트 없음</div>';

 // 라이프사이클 — 부진·정체만 크게, 나머지는 칩 요약
 const lc=d.lifecycle||{};
 if(lc.counts){
  const order=['부진','정체','관찰','신규','판매중'];
  document.getElementById('lc_sum').textContent=`— 총 ${lc.total}개: `+order.filter(k=>lc.counts[k]).map(k=>`${k} ${lc.counts[k]}`).join(' · ');
  const att=lc.attention||[];
  let lh='';
  if(att.length){
   lh+=`<table><tr><th>상품</th><th class=num>경과</th><th class=num>주문</th><th>단계</th><th>권장 조치</th></tr>`
    +att.map(r=>`<tr><td>${esc(r.상품명)}${r.쿠팡노출?` <span class=dim>${esc(r.쿠팡노출)}</span>`:''}</td><td class=num>${r.경과일}일</td><td class=num>${r.주문수}</td><td><span class="tag ${r.단계==='부진'?'bad':'ok'}">${r.단계}</span></td><td class=dim>${esc(r.조치)}</td></tr>`).join('')+'</table>';
  }else{
   lh+='<div class=okbox>✓ 정체·부진 상품 없음 — 전 상품이 신규·관찰 구간</div>';
  }
  const au=lc.autopsy||[];
  if(au.length){
   lh+=`<details><summary>팔린 상품 부검 ${au.length}건</summary><table><tr><th>날짜</th><th>마켓</th><th>상품</th><th class=num>판매가</th><th class=num>마진율</th><th class=num>등록→주문</th></tr>`
    +au.map(a=>`<tr><td>${esc(a.날짜)}</td><td>${esc(a.마켓)}</td><td>${esc(a.상품명)}</td><td class=num>${원(a.판매가)}</td><td class=num><b>${a.마진율}%</b></td><td class=num>${esc(a['등록→주문'])}</td></tr>`).join('')+'</table></details>';
  }
  document.getElementById('lifecycle').innerHTML=lh;
 }

 // 상품 표
 document.getElementById('prods').innerHTML=
  `<tr><th>상품</th><th class=num>매입가</th><th class="num cp">🏆 쿠팡 판매가</th><th class="num cp">쿠팡 남는돈</th><th class="num ss">스스 판매가</th><th class="num ss">스스 남는돈</th><th>상태</th></tr>`+
  d.products.map(p=>`<tr><td>${p.발주링크?`<a href="${esc(p.발주링크)}" target=_blank style="color:var(--tx);text-decoration:underline dotted #4c8dff">${esc(p.이름)}</a>`:esc(p.이름)}</td><td class=num>${원(p.원가)}</td>
   <td class="num cp">${p.쿠팡판매가?원(p.쿠팡판매가):`<span class=dim style="font-size:11px">${esc(p.쿠팡사유||'-')}</span>`}</td><td class="num cp"><b>${원(p.쿠팡이익)}</b></td>
   <td class="num ss">${원(p.판매가)}</td><td class="num ss">${원(p.세전이익)}</td><td>${p.상태==='정상'?'<span class="tag ok">정상</span>':(p.상태||'').includes('자동')?`<span class="tag ok">${esc(p.상태)}</span>`:`<span class="tag bad">${esc(p.상태)}</span> <span class=dim>${esc(p.상세)}</span>`}</td></tr>`).join('');

 const ms=d.market_state||{};
 document.getElementById('mstate').textContent = ms.rows
  ? `— 시세DB: 검색어 ${ms.keywords}개·${ms.rows}행 (확장 실시간 ${ms.live_keywords||0}개${ms.live_last?' · '+ms.live_last.slice(5,16):''})`
  : '— 시세DB 비어있음';
 document.getElementById('log').textContent=d.log;
}

// ── 원격판: 데이터는 클라우드에서, 액션은 큐로 (맥이 5분 내 실행) ──
const RKEY=new URLSearchParams(location.search).get('key');
const API='https://gvhbwbvgwnfqpqyimizi.supabase.co/functions/v1/admin';
function queueAct(kind,payload){
 return fetch(API+'/action?key='+RKEY,{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({kind,payload})}).then(r=>r.json())
  .then(o=>toast(o.ok?'대기열 등록 — 맥이 5분 내 실행':'실패: '+(o.msg||'')));
}
function load(){
 if(!RKEY){document.body.innerHTML='<h3 style="font-family:sans-serif">접속 키가 필요합니다 (?key=)</h3>';return}
 fetch(API+'/data?key='+RKEY).then(r=>r.json()).then(rows=>{
  const st={};(rows||[]).forEach(x=>st[x.kind]=x);
  const d=(st.dashboard||{}).payload; const ts=(st.dashboard||{}).updated_at;
  if(!d){toast('아직 동기화된 데이터 없음');return}
  document.title='제로데일리 관제탑 · '+new Date(ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  render(d);
 }).catch(()=>{});
}
function run(j){queueAct('run',{job:j})}
function mark(pid,st){queueAct('status',{productOrderId:pid,상태:st})}
function ship(pid,mk){
 const dc=document.getElementById('dc_'+pid).value, tn=document.getElementById('tn_'+pid).value.trim();
 if(!tn){toast('송장번호를 입력하세요');return}
 if(!confirm(`발송처리 하시겠어요?\n택배사: ${dc} / 송장: ${tn}\n(${mk==='쿠팡'?'쿠팡':'스마트스토어'}에 실제 발송으로 등록됩니다)`))return;
 queueAct('dispatch',{productOrderId:pid,company:dc,tracking:tn});
}
load();setInterval(()=>{if(!paused)load()},60000);
</script></div></body></html>

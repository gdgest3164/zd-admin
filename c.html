<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제로데일리 한눈에</title>
<!-- 2026-11-09 사장님 "관리페이지 너무 불편·산만" → 한 장 화면. 같은 날 "달력처럼 월별로" → 참고 4곳 비교 그림에서 '달 넘기기 + 달력 칸' 선택
     (② 캐시노트: 달 넘기기+큰 합계 · ④ 달력 히트맵: 날짜 칸 색 = 금액 · ③ Sellerboard: 월별 막대). 계산 관제_사장님.py·관제_달력.py.
     데이터: 로컬 /data · 폰 Supabase dashboard payload 의 '사장님' 블록. 색·글꼴은 관제탑 B 와 같다. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root{--bg:#0B0C0D;--panel:#121415;--line:#24282B;--line2:#191C1E;--tx:#DCE0E2;--mut:#8C9296;--dim:#7D8489;--acc:#7FA0B8;--ok:#6FB08A;--warn:#D9A867;--bad:#D9736B;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;background:#101213;border-bottom:1px solid var(--line)}
.st{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.todo{font-family:var(--mono);font-size:12px;min-height:40px;padding:0 14px;border:1px solid #4A3C28;background:#1C1710;color:var(--warn);cursor:pointer}.todo.zero{border-color:#2B4438;background:#121A16;color:var(--ok);cursor:default}
#todoBox{display:none;background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px 8px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0 4px}.nav b{font-size:18px;font-weight:600}
.nb{width:44px;height:44px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font-size:18px;cursor:pointer}.nb:disabled{opacity:.3;cursor:default}
.src{font-family:var(--mono);font-size:11px;color:var(--dim)}
.tot{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;padding:8px 0 14px}
.big{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-1px;line-height:1.15}.mid{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1.3}
.sub{font-size:12px;color:var(--mut);margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11px;color:var(--dim);text-align:center;padding-bottom:2px}
.d{position:relative;min-height:58px;padding:4px 5px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.d .n{font-family:var(--mono);font-size:11px;color:var(--mut)}.d .o{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right}.d .p{font-family:var(--mono);font-size:10px;color:var(--tx);text-align:right;opacity:.85}
.d.empty{background:transparent;border-color:transparent;cursor:default}.d.fut{opacity:.35;cursor:default}.d.today{outline:1px solid var(--acc);outline-offset:-1px}.d.sel{outline:2px solid var(--tx);outline-offset:-2px}
.pick{font-size:13px;min-height:40px;padding:10px 0;color:var(--tx);border-bottom:1px solid var(--line2)}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:8px;flex-wrap:wrap}.lg i{display:inline-block;width:14px;height:10px}
.mb{display:grid;gap:6px;margin:16px 0 4px}.mr{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;min-height:32px;cursor:pointer;background:none;border:0;color:var(--tx);padding:0;text-align:left;font:inherit}
.mr .k{font-size:12px;color:var(--mut)}.mr .bar{height:14px;background:#4A5C68}.mr.on .bar{background:var(--acc)}.mr.on .k{color:var(--tx);font-weight:600}.mr .v{font-family:var(--mono);font-size:12px;min-width:84px;text-align:right}
.sec{border-top:1px solid var(--line);margin-top:14px}
details.ln{border-bottom:1px solid var(--line)}details.ln>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 0}
details.ln>summary::-webkit-details-marker{display:none}details.ln>summary .t{font-size:13px;color:var(--mut);width:64px;flex:none}details.ln>summary .s{flex:1;font-size:13.5px}details.ln>summary:after{content:'+';color:var(--dim);font-family:var(--mono)}details.ln[open]>summary:after{content:'−'}
.body{padding:0 0 12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}.row:last-child{border-bottom:0}.row .r{font-family:var(--mono);white-space:nowrap}
.row small{display:block;color:var(--dim);font-size:11.5px}
.why{font-size:12.5px;color:var(--warn);margin-top:6px}.note{font-size:12px;color:var(--dim);margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:10px}.bars i{flex:1;background:#4A5C68;min-height:2px}.bars i.last{background:var(--acc)}
.bl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px}
#todoBox details summary{cursor:pointer;color:var(--acc);font-size:12.5px;padding:12px 0;border-bottom:1px solid var(--line2)}
.foot{max-width:760px;margin:0 auto;padding:14px 16px 40px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:400px){.big{font-size:22px}.mid{font-size:16px}.d{min-height:52px;padding:3px 4px}.d .p{font-size:9px}}
</style></head><body>
<div class="hd"><div class="st" id="st"><span class="dot"></span>불러오는 중</div><button class="todo zero" id="todoBtn" type="button" aria-expanded="false">할 일 -</button></div>
<div id="todoBox"></div>
<main class="wrap"><div id="month"></div><div class="sec" id="lines"></div></main>
<div class="foot"><span id="stamp"></span><span><a id="oldLink" href="/b">이전 화면</a></span></div>
<script>
const REMOTE=location.hostname.endsWith('github.io'),RKEY=new URLSearchParams(location.search).get('key'),API='https://gvhbwbvgwnfqpqyimizi.supabase.co/functions/v1/admin';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>(n==null||n==='')?'-':Math.round(Number(n)).toLocaleString('ko-KR'),W=n=>(n==null||n==='')?'-':N(n)+'원';
const SG=n=>n==null?'':(n>0?'+':'')+N(n);
const K=n=>n==null?'':(Math.abs(n)>=10000?(n/10000).toFixed(Math.abs(n)>=100000?0:1)+'만':N(n));
const row=(l,r,s,cls='')=>`<div class="row"><div>${l}${s?`<small>${s}</small>`:''}</div><div class="r ${cls}">${r}</div></div>`;
const bars=(vals,labels)=>{const mx=Math.max(1,...vals);return `<div class="bars">${vals.map((v,i)=>`<i class="${i===vals.length-1?'last':''}" style="height:${Math.round(100*v/mx)}%" title="${esc(labels[i])} ${N(v)}"></i>`).join('')}</div><div class="bl"><span>${esc(labels[0]||'')} ${N(vals[0])}</span><span>${esc(labels[labels.length-1]||'')} ${N(vals[vals.length-1])}</span></div>`};
const line=(t,dot,s,body)=>`<details class="ln"><summary><span class="t">${t}</span><span class="dot ${dot}"></span><span class="s">${s}</span></summary><div class="body">${body}</div></details>`;
const KIND={반품판매중지후보:'반품 많은 상품 — 판매중지 판단',브랜드협상후보:'브랜드 협상',반려복구:'쿠팡 반려 상품',현금흐름:'현금흐름',배송지연안내:'배송 지연 안내'};
let D=null,CUR=null,SEL=null;

function head(s,t){const st=document.getElementById('st'),c={정상:'ok',주의:'warn',정지:'bad'}[s.판정]||'warn';
 st.className='st '+c;st.innerHTML=`<span class="dot"></span>${esc(s.판정||'-')}`;
 const b=document.getElementById('todoBtn'),n=(t&&t.건수)||0;b.textContent='할 일 '+n+'건';b.className='todo'+(n?'':' zero');
 const g={};(t&&t.목록||[]).forEach(x=>(g[x.종류]=g[x.종류]||[]).push(x));const box=document.getElementById('todoBox');
 const h=Object.keys(g).map(k=>`<details><summary>${esc(KIND[k]||k)} ${g[k].length}건</summary>${g[k].map(x=>`<div class="note">${esc(x.내용)}</div>`).join('')}</details>`).join('')||'<div class="note">사장님이 할 일 없음</div>';if(box.dataset.h!==h){box.innerHTML=h;box.dataset.h=h}}

function cellBg(p,mx,mn){if(p==null||p===0)return '';const a=p>0?.14+.6*Math.min(1,p/mx):.2+.5*Math.min(1,p/mn);return `background:rgba(${p>0?'127,160,184':'217,115,107'},${a.toFixed(2)})`}
function renderMonth(){const c=D.달력,el=document.getElementById('month');
 if(!c||c.error){el.innerHTML=`<div class="why">달력 계산 실패: ${esc(c&&c.error)}</div>`;return}
 const months=c.월.map(m=>m.월),i=months.indexOf(CUR),m=c.월[i]||{},[y,mo]=CUR.split('-').map(Number);
 const ps=Object.entries(c.일).filter(([d])=>d.startsWith(CUR)).map(([,v])=>v[1]).filter(v=>v!=null);
 const mx=Math.max(1,...ps.filter(v=>v>0)),mn=Math.min(-1,...ps.filter(v=>v<0));
 const first=new Date(y,mo-1,1).getDay(),last=new Date(y,mo,0).getDate();let cells='';
 for(let k=0;k<first;k++)cells+='<div class="d empty"></div>';
 for(let dd=1;dd<=last;dd++){const key=`${CUR}-${String(dd).padStart(2,'0')}`,v=c.일[key],fut=key>c.오늘;
  cells+=`<div class="d${fut?' fut':''}${key===c.오늘?' today':''}${key===SEL?' sel':''}" data-k="${key}" style="${v?cellBg(v[1],mx,mn):''}" title="${key} 주문 ${v?v[0]:0}건 · 순수익 ${v?W(v[1]):'-'}"><span class="n">${dd}</span>${v&&v[0]?`<span class="o">${v[0]}건</span><span class="p">${esc(K(v[1]))}</span>`:''}</div>`}
 const sv=SEL&&c.일[SEL],sd=SEL&&new Date(SEL+'T00:00');
 const pick=sv?`${sd.getMonth()+1}월 ${sd.getDate()}일 (${'일월화수목금토'[sd.getDay()]}) · 주문 ${sv[0]}건 · 순수익 ${W(sv[1])}`:'날짜를 누르면 그날 주문·순수익';
 const mxm=Math.max(1,...c.월.map(x=>Math.abs(x.순수익||0)));
 el.innerHTML=`<div class="nav"><button class="nb" id="pv" ${i<=0?'disabled':''} aria-label="이전 달">‹</button><b>${y}년 ${mo}월</b><button class="nb" id="nx" ${i>=months.length-1?'disabled':''} aria-label="다음 달">›</button></div>
 <div class="src" style="text-align:center">세후 순수익 · 구매확정 전 추정 포함${m.추정건?` (${m.추정건}건)`:''}</div>
 <div class="tot"><div><div class="big ${m.순수익<0?'bad':''}">${W(m.순수익)}</div><div class="sub">순수익</div></div><div><div class="mid">${N(m.주문)}건</div><div class="sub">주문${CUR===c.오늘.slice(0,7)?` · 오늘 ${N((c.일[c.오늘]||[0])[0])}건`:''}</div></div><div><div class="mid">${K(m.매출)}</div><div class="sub">매출</div></div></div>
 <div class="cal">${[...'일월화수목금토'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
 <div class="pick">${pick}</div>
 <div class="lg"><i style="background:rgba(127,160,184,.2)"></i><i style="background:rgba(127,160,184,.74)"></i>순수익 적음 → 많음 <i style="background:rgba(217,115,107,.6);margin-left:8px"></i>손해 난 날 · 칸 숫자 = 주문 수 / 순수익</div>
 <div class="mb">${c.월.map(x=>`<button class="mr${x.월===CUR?' on':''}" data-m="${esc(x.월)}"><span class="k">${x.월.slice(0,4)==c.오늘.slice(0,4)?'':x.월.slice(2,4)+'년 '}${Number(x.월.slice(5))}월</span><span><span class="bar" style="display:block;width:${Math.max(2,Math.round(100*Math.abs(x.순수익||0)/mxm))}%;${(x.순수익||0)<0?'background:rgba(217,115,107,.6)':''}"></span></span><span class="v">${W(x.순수익)} · ${N(x.주문)}건</span></button>`).join('')}</div>`;
 el.querySelector('#pv').onclick=()=>{CUR=months[i-1];SEL=null;renderMonth()};el.querySelector('#nx').onclick=()=>{CUR=months[i+1];SEL=null;renderMonth()};
 el.querySelectorAll('.d[data-k]').forEach(x=>x.onclick=()=>{if(x.classList.contains('fut'))return;SEL=x.dataset.k;renderMonth()});
 el.querySelectorAll('.mr').forEach(x=>x.onclick=()=>{CUR=x.dataset.m;SEL=null;renderMonth()})}

function lSys(s){if(s.error)return line('시스템','warn','계산 실패',esc(s.error));
 const tiles=s.칸.map(x=>row(esc(x.이름),esc(x.값),'',x.정상?'':'bad')).join('')+s.기타이상.map(x=>row(esc(x.이름),esc(x.값),'기준 '+esc(x.기준),'bad')).join('');
 const ok=s.판정==='정상'&&!s.기타이상.length;
 return line('시스템',ok?'ok':s.판정==='정지'?'bad':'warn',ok?'모두 정상':'확인 필요: '+s.이유.map(esc).join(', '),tiles+`<div class="note">그 밖의 점검 ${s.기타정상}개 정상 · 5분마다 갱신</div>`)}
function lMoney(d){if(d.error)return line('돈','warn','계산 실패',esc(d.error));
 const age=d.통장시간==null?'':d.통장시간>=48?Math.round(d.통장시간/24)+'일 전':d.통장시간+'시간 전',k=d.카드||{};
 const s=`통장 ${W(d.통장)}${d.장부맞춤필요?' (장부 맞춤 필요)':d.통장오래됨?` (${age} 값)`:''} · 7일 입금 ${W(d['7일입금'])}`;
 return line('돈',d.장부맞춤필요||d.통장오래됨?'warn':'ok',s,
  row('사업 통장',W(d.통장),`후잉 x22 · ${esc(d.통장기준||'-')} 기준`,d.장부맞춤필요?'bad':'')+
  row('7일 안에 들어올 돈',W(d['7일입금']),'쿠팡 정산 API · '+((d['7일입금행']||[]).map(r=>esc(String(r.일).slice(5))+' '+N(r.금액)).join(' · ')||'없음'))+
  (k.금액?row('카드 대금',W(k.금액),`${esc(k.결제일)} 결제 · ${esc(k.이용월)} 이용 ${N(k.건수)}건`):'')+
  row('다음 7일 무신사 결제 예상',W(d['7일결제예상']),`최근 14일 하루 평균 ${N(d.일평균결제)} × 7 (추정)`,'mut'))}
function lLoss(l){if(l.error)return line('손해','warn','계산 실패',esc(l.error));
 const w=l.대기||[],r=l.손해가격리스팅||{},p=String(r.값||'-').split(' · ');
 const s=`이번 달 ${l.확정==null?'알 수 없음':W(l.확정)} · 손해 가격 리스팅 ${esc(p[0])} · 환불 대기 ${w.length}건`;
 return line('손해',l.확정==null?'warn':(l.확정>0||!r.정상)?'warn':'ok',s,
  row('이번 달 확정 손해',l.확정==null?'알 수 없음':W(l.확정),`반품 손실 ${l.반품손실==null?'읽기 실패':W(l.반품손실)} · 손해 본 주문 ${(l.역마진||[]).length}건 · 세후`)+
  (l.역마진||[]).map(x=>row(esc(x.상품),W(x.손해),`판매 ${N(x.판매가)} · 결제 ${N(x.결제)}`,'bad')).join('')+
  row('지금 주문 오면 손해인 리스팅',esc(p[0]),[...p.slice(1).map(esc),'지금 원가·옵션 추가금 기준 세전 0 미만 · 지혈이 자동 인상'].join(' · '),r.정상?'ok':'warn')+
  w.map(x=>row(esc(x.상품),W(x.결제),`${esc(x.종류)} · ${x.일??'-'}일째`,'warn')).join(''))}
function lVisit(v,ls){if(v.error||ls.error)return line('방문','warn','계산 실패',esc(v.error||ls.error));const r=v.최근||{},tr=v.추이||[],reg=ls.일별등록||[];
 const s=`방문 있는 상품 ${N(r.방문상품)}개 · 방문 0 ${r.방문0비율!=null?r.방문0비율+'%':'-'} · 판매중 ${N(ls.판매중)}개`;
 return line('방문',r.방문0비율==null?'warn':'ok',s,
  `<div class="note">WING 상품지표(7일) ${esc(String(r.기간||'').slice(5,10))}~${esc(String(r.기간||'').slice(16))} · 판매중은 ${esc(r.판매중기준||'-')}</div>${bars(tr.map(x=>x.방문상품),tr.map(x=>String(x.기간).slice(16)))}<div class="note">주별 방문 있는 상품 수 (WING 파일을 받은 주만)</div>`+
  row('판매중 리스팅',N(ls.판매중)+'개',ls.증감7일!=null?esc(String(ls.기준일).slice(5))+' 대비 '+SG(ls.증감7일):`증감은 ${esc(String(ls.기록시작||'').slice(5))}부터 기록`)+
  `${bars(reg.map(x=>x.수),reg.map(x=>String(x.일).slice(5)))}<div class="note">하루 새 등록 수 (30일)</div>`)}

function render(d){const o=d&&d.사장님;if(!o){fail('요약 데이터가 아직 없음 — 다음 동기화(5분) 뒤 다시 보기');return}
 if(o.error){fail('계산 실패: '+o.error);return}
 D=o;head(o.시스템||{},o.할일);const c=o.달력||{};if(!CUR&&c.오늘)CUR=c.오늘.slice(0,7);renderMonth();
 const L=document.getElementById('lines'),open=[...L.querySelectorAll('details')].map(x=>x.open);
 L.innerHTML=lSys(o.시스템||{})+lMoney(o.돈||{})+lLoss(o.손해||{})+lVisit(o.방문||{},o.리스팅||{});
